name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -az --delete \
            --exclude='backend' \
            frontend/dist/ \
            -e "ssh -i ~/.ssh/deploy_key" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/plastimar-erp/

      - name: Deploy backend
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='ecosystem.config.cjs' \
            backend/ \
            -e "ssh -i ~/.ssh/deploy_key" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/plastimar-erp/backend/

      - name: Restart API
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/plastimar-erp/backend
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 reload ecosystem.config.cjs --update-env
          EOF
