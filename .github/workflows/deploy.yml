name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plastimar
          POSTGRES_PASSWORD: plastimar
          POSTGRES_DB: plastimar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plastimar -d plastimar_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://plastimar:plastimar@localhost:5432/plastimar_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Validate backend schema
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: Prepare backend test database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Run backend focal tests
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: npm test -- staging-smoke.test.js app.test.js rrhh-helpers.test.js despachos-traceability.test.js despachos.test.js odt-costeo.test.js odt-list-helpers.test.js odt-consumos.test.js odt-item-workflow.test.js odt-operations.test.js pasar-taller.test.js

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup production database
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -e
             cd /var/www/plastimar-erp/backend
             set -a
             . ./.env
             set +a
             test -n "$DATABASE_URL"
             mkdir -p /var/backups/plastimar/db
             backup="/var/backups/plastimar/db/plastimar_erp_$(date +%Y%m%d_%H%M%S).dump"
             pg_dump -Fc "$DATABASE_URL" -f "$backup"
             test -s "$backup"
             pg_restore --list "$backup" >/dev/null
             echo "Backup verified: $backup"'

      - name: Deploy backend
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='ecosystem.config.cjs' \
            --exclude='data/facturacion' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/plastimar-erp/backend/

      - name: Migrate and restart API
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -e
             cd /var/www/plastimar-erp/backend
             test -f ecosystem.config.cjs
             npm ci
             npx prisma generate
             node scripts/deduplicate-cliente-emails.mjs
             npx prisma migrate resolve --rolled-back 20260526102000_cliente_email_unique_guard || true
             # La version inicial intento un indice UNIQUE sobre codigos historicos duplicados.
             # La migracion actual ya usa un indice no unico y puede reintentarse con seguridad.
             npx prisma migrate resolve --rolled-back 20260828_SB_codigo_barra_unico || true
             npx prisma migrate deploy
             node --input-type=module -e "import(\"./src/app.js\").then(async ({ buildApp }) => { const app = buildApp({ logger: false }); await app.ready(); await app.close(); console.log(\"API module ready\") })"
             npm prune --omit=dev
             pm2 startOrReload ecosystem.config.cjs --update-env'

      - name: Smoke API
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -e
             cd /var/www/plastimar-erp/backend
             set -a
             . ./.env
             set +a
             port="${PORT:-3001}"
             for attempt in $(seq 1 30); do
               if curl -fsS "http://127.0.0.1:${port}/api/health"; then
                 break
               fi
               echo "API health not ready yet (attempt ${attempt}/30)"
               sleep 2
               if [ "$attempt" -eq 30 ]; then
                 echo "API health failed after retries"
                 pm2 status || true
                 pm2 logs --nostream --lines 80 || true
                 ss -ltnp || true
                 exit 1
               fi
             done
             mkdir -p /var/backups/plastimar/smoke
             smoke_report="/var/backups/plastimar/smoke/staging_smoke_$(date +%Y%m%d_%H%M%S).json"
             if ! node scripts/staging-smoke.mjs --base-url="http://127.0.0.1:${port}" --json > "$smoke_report"; then
               cat "$smoke_report" || true
               exit 1
             fi
             test -s "$smoke_report"
             echo "Smoke verified: $smoke_report"'

      - name: Deploy frontend
        run: |
          rsync -az --delete \
            --exclude='backend' \
            --exclude='.env' \
            --exclude='ecosystem.config.cjs' \
            --exclude='.well-known' \
            --exclude='uploads' \
            --exclude='storage' \
            --exclude='logs' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/plastimar-erp/
