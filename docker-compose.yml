# Entorno local de desarrollo: Postgres + pgvector (RAG).
# Reproduce el contenedor `plastimar-postgres-local` que antes se creaba a mano.
#
# Uso:
#   docker compose up -d            # levanta la base
#   cd backend && npx prisma migrate deploy   # aplica el esquema
#   cd backend && npm run db:seed             # datos semilla de desarrollo
#
# El contenedor crea dos bases aisladas:
#   - plastimar_dev: uso diario del backend local
#   - plastimar_test: migraciones y suites de integracion

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: plastimar-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: plastimar
      POSTGRES_PASSWORD: plastimar
      POSTGRES_DB: plastimar_dev
    ports:
      - "55432:5432"
    volumes:
      - plastimar_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plastimar -d plastimar_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  plastimar_pgdata:
    name: plastimar_pgdata
